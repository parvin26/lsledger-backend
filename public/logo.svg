<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" fill="none" aria-hidden="true">
  <title>Lighthouse Ledger</title>
  <!-- Base -->
  <rect x="35" y="100" width="50" height="12" rx="2" fill="#4a4a4a"/>
  <!-- Stacked segments (server-rack style with vents/slots) -->
  <path d="M40 88 L45 100 L75 100 L80 88 Z" fill="#4a4a4a"/>
  <line x1="48" y1="92" x2="72" y2="92" stroke="#6b6b6b" stroke-width="0.8"/>
  <line x1="52" y1="88" x2="52" y2="100" stroke="#5a5a5a" stroke-width="0.6"/>
  <line x1="60" y1="88" x2="60" y2="100" stroke="#5a5a5a" stroke-width="0.6"/>
  <line x1="68" y1="88" x2="68" y2="100" stroke="#5a5a5a" stroke-width="0.6"/>

  <path d="M42 76 L47 88 L73 88 L78 76 Z" fill="#4a4a4a"/>
  <line x1="50" y1="80" x2="70" y2="80" stroke="#6b6b6b" stroke-width="0.8"/>
  <line x1="54" y1="76" x2="54" y2="88" stroke="#5a5a5a" stroke-width="0.6"/>
  <line x1="60" y1="76" x2="60" y2="88" stroke="#5a5a5a" stroke-width="0.6"/>
  <line x1="66" y1="76" x2="66" y2="88" stroke="#5a5a5a" stroke-width="0.6"/>

  <path d="M44 64 L48 76 L72 76 L76 64 Z" fill="#4a4a4a"/>
  <line x1="52" y1="68" x2="68" y2="68" stroke="#6b6b6b" stroke-width="0.8"/>
  <line x1="56" y1="64" x2="56" y2="76" stroke="#5a5a5a" stroke-width="0.6"/>
  <line x1="60" y1="64" x2="60" y2="76" stroke="#5a5a5a" stroke-width="0.6"/>
  <line x1="64" y1="64" x2="64" y2="76" stroke="#5a5a5a" stroke-width="0.6"/>

  <path d="M46 52 L49 64 L71 64 L74 52 Z" fill="#4a4a4a"/>
  <line x1="54" y1="56" x2="66" y2="56" stroke="#6b6b6b" stroke-width="0.8"/>
  <line x1="57" y1="52" x2="57" y2="64" stroke="#5a5a5a" stroke-width="0.6"/>
  <line x1="60" y1="52" x2="60" y2="64" stroke="#5a5a5a" stroke-width="0.6"/>
  <line x1="63" y1="52" x2="63" y2="64" stroke="#5a5a5a" stroke-width="0.6"/>

  <path d="M48 40 L50 52 L70 52 L72 40 Z" fill="#4a4a4a"/>
  <line x1="56" y1="44" x2="64" y2="44" stroke="#6b6b6b" stroke-width="0.8"/>
  <line x1="58" y1="40" x2="58" y2="52" stroke="#5a5a5a" stroke-width="0.6"/>
  <line x1="60" y1="40" x2="60" y2="52" stroke="#5a5a5a" stroke-width="0.6"/>
  <line x1="62" y1="40" x2="62" y2="52" stroke="#5a5a5a" stroke-width="0.6"/>

  <path d="M50 28 L51 40 L69 40 L70 28 Z" fill="#4a4a4a"/>
  <line x1="58" y1="32" x2="62" y2="32" stroke="#6b6b6b" stroke-width="0.8"/>
  <line x1="59" y1="28" x2="59" y2="40" stroke="#5a5a5a" stroke-width="0.6"/>
  <line x1="60" y1="28" x2="60" y2="40" stroke="#5a5a5a" stroke-width="0.6"/>
  <line x1="61" y1="28" x2="61" y2="40" stroke="#5a5a5a" stroke-width="0.6"/>

  <path d="M52 16 L52 28 L68 28 L68 16 Z" fill="#4a4a4a"/>
  <line x1="58" y1="20" x2="62" y2="20" stroke="#6b6b6b" stroke-width="0.8"/>
  <line x1="56" y1="16" x2="56" y2="28" stroke="#5a5a5a" stroke-width="0.6"/>
  <line x1="60" y1="16" x2="60" y2="28" stroke="#5a5a5a" stroke-width="0.6"/>
  <line x1="64" y1="16" x2="64" y2="28" stroke="#5a5a5a" stroke-width="0.6"/>

  <!-- Blue band with three lighter blue vertical slots -->
  <rect x="54" y="4" width="16" height="14" rx="1" fill="#2563eb"/>
  <line x1="57" y1="5" x2="57" y2="17" stroke="#60a5fa" stroke-width="1"/>
  <line x1="61" y1="5" x2="61" y2="17" stroke="#60a5fa" stroke-width="1"/>
  <line x1="65" y1="5" x2="65" y2="17" stroke="#60a5fa" stroke-width="1"/>

  <!-- Red beacon (lantern) -->
  <rect x="56" y="0" width="12" height="6" rx="1" fill="#b71c2a"/>
